name: Release

on:
  push:
    tags: ['v*']
  # lets the build be exercised without cutting a tag; the release step is skipped then
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Extracting the multi-GB Rider SDK overflows the stock runner disk without this
      # (tool-cache + large-packages are the settings that actually free space).
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          large-packages: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # global.json pins 9.0.308 with rollForward:disable (the dev machine cannot run 9.0.312),
      # so the runner needs exactly that SDK or the backend build fails to start.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.308'

      - name: Cache Gradle (incl. downloaded Rider SDK)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # buildPlugin also builds the .NET backend, against the ReSharperHost assemblies inside the
      # Rider distribution Gradle downloads - no Rider installation is required on the runner.
      # Release configuration: STRUCT_LAYOUT_DIAGNOSTICS is a Debug-only define, so the layout dump is
      # compiled out of anything published from here.
      - run: ./gradlew --no-daemon --console=plain buildPlugin -PBuildConfiguration=Release "-Dorg.gradle.java.installations.paths=$JAVA_HOME"

      - name: Check both halves made it into the zip
        run: |
          zip=$(ls build/distributions/*.zip)
          unzip -l "$zip"
          unzip -l "$zip" | grep -q 'dotnet/ReSharperPlugin.StructLayout.dll' || { echo "backend dll missing from $zip"; exit 1; }
          unzip -l "$zip" | grep -q 'lib/struct-layout-.*\.jar' || { echo "frontend jar missing from $zip"; exit 1; }

      - name: Upload the zip as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: struct-layout-plugin
          path: build/distributions/*.zip

      - name: Publish GitHub release with the plugin zip
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/distributions/*.zip
          generate_release_notes: true

      # Rider only auto-updates a plugin from its recorded source; a disk install never updates. This
      # keeps a custom plugin repository (updatePlugins.xml on master) pointing at the newest release.
      - name: Update updatePlugins.xml on master
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # read the real asset name and the compatibility range BEFORE the checkout swaps the tree
          ZIP=$(basename "$(ls build/distributions/*.zip | head -1)")

          # Re-running an older tag's workflow would otherwise point the XML back at that old release.
          # checkout fetches no tags by default, hence the explicit fetch. --force: checkout stores the pushed
          # annotated tag as a lightweight one, so without it the fetch is refused ("would clobber existing tag").
          git fetch --tags --force --quiet origin
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ "$GITHUB_REF_NAME" != "$LATEST" ]; then
            echo "$GITHUB_REF_NAME is not the newest tag ($LATEST); leaving updatePlugins.xml alone"
            exit 0
          fi
          SINCE=$(grep -oP 'pluginSinceBuild\s*=\s*\K\S+' gradle.properties)
          UNTIL=$(grep -oP 'pluginUntilBuild\s*=\s*\K\S+' gradle.properties)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B master origin/master

          cat > updatePlugins.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!-- Custom plugin repository (JetBrains "Manage Plugin Repositories" format).
               Add https://raw.githubusercontent.com/gaetan-deturche/rider-structure-layout/master/updatePlugins.xml
               in Settings | Plugins | gear | Manage Plugin Repositories to receive updates.
               Regenerated by the release workflow on every v* tag. -->
          <plugins>
            <plugin id="dev.structlayout"
                    url="https://github.com/gaetan-deturche/rider-structure-layout/releases/download/v${VERSION}/${ZIP}"
                    version="${VERSION}">
              <idea-version since-build="${SINCE}" until-build="${UNTIL}"/>
            </plugin>
          </plugins>
          EOF
          sed -i 's/^          //' updatePlugins.xml

          # stage first: on the very first run the file may be untracked, which `git diff` ignores
          git add updatePlugins.xml
          if ! git diff --cached --quiet; then
            git commit -m "Point updatePlugins.xml at v${VERSION}"
            git push origin master
          fi
